# Lefthook configuration
# See: https://github.com/evilmartians/lefthook

skip_lfs: true

pre-commit:
  commands:
    generate-docs:
      priority: 1
      run: ./scripts/generate-skills-docs.ts && git add docs/skills/
    prettier:
      priority: 2
      glob: "*.{ts,js,md,json,yaml,yml}"
      run: prettier --write {staged_files} && git add {staged_files}
    type-check:
      run: bun x --bun tsc --noEmit
    # lint:
    #   glob: "*.{ts,js}"
    #   run: bun x --bun eslint {staged_files} --max-warnings 0
    # test:
    #   run: bun test

    # Smart checks: only on staged files
    markdownlint:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    skills-validate:
      glob: "skills/*/SKILL.md"
      run: for f in {staged_files}; do skills-ref validate $(dirname $f); done
    lychee:
      run: lychee --offline .
    nix-flake-check:
      glob: "{flake.nix,flake.lock,zensical.toml}"
      run: nix flake check --print-build-logs
